name: Telegram Plant Bot

on:
  push:
    branches: [main]
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-plant-bot-state
  cancel-in-progress: false

jobs:
  poll-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Poll Telegram and process one cycle
        id: bot
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PLANT_STATE_FILE: plant_state.json
        run: python -m bot.app
      - name: Save bot state in the repository
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f plant_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: save Telegram plant bot state [skip ci]"
            git pull --rebase origin "$BRANCH"
            git push origin "HEAD:$BRANCH"
          fi
      - name: Report bot failure after saving state
        if: steps.bot.outcome == 'failure'
        run: exit 1
